name: Publish Docker
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to tag the published image with'
        required: true
        default: 'staging'
  push:
    branches:
      - 'staging'
      - 'dev'
      - 'main'
      - 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Workflow run cleanup action
      uses: rokroskar/workflow-run-cleanup-action@ee1451b869ba1e381729b3d40489997021f0d562 # v0.3.3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
    - name: Login to de.NBI OCI
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
      with:
          registry: oci.bi.denbi.de
          username: ${{ secrets.OCI_DENBI_USERNAME }}
          password: ${{ secrets.OCI_DENBI_TOKEN }}
    - name: Build and publish image to de.NBI OCI
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
          file: Dockerfile
          push: true
          # Tag follows the triggering branch (workflow_dispatch input, or the
          # pushed branch on push events) instead of the previously hardcoded
          # "staging", so publishing from any branch yields a matching tag.
          tags: oci.bi.denbi.de/denbicloud/mkdocswebhook:${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
