name: Daily Rebuild and Scan
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  rebuild_and_scan:
    uses: denbi/portal-github-actions/.github/workflows/release-image.yml@834c88780464328da0cae7d6350981b8854de479 # main
    with:
      image_name: oci.bi.denbi.de/denbicloud/mkdocswebhook
      dockerfile: Dockerfile
      notify_matrix: true
    secrets:
      OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
      OCI_TOKEN: ${{ secrets.OCI_TOKEN }}
      CUSTOM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
      MATRIX_ROOM: ${{ secrets.MATRIX_CRITICAL_ROOM }}
